<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">API REST de Valeria Segovia</title>
  <desc id="description">Proyecto académico con Express, HTTPS, OpenAPI y autenticación por API Key.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102a43"/>
      <stop offset="100%" stop-color="#176b87"/>
    </linearGradient>
    <clipPath id="campusPhotoClip">
      <rect x="790" y="24" width="370" height="232" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <image href="/campus-api.png" xlink:href="/campus-api.png" x="790" y="24" width="370" height="232" preserveAspectRatio="xMidYMid slice" clip-path="url(#campusPhotoClip)"/>
  <rect x="790" y="24" width="370" height="232" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
  <text x="64" y="82" fill="#8de7df" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">DOCUMENTACIÓN DE API</text>
  <text x="64" y="145" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">API REST de Valeria Segovia</text>
  <text x="64" y="188" fill="#d9eaf2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Express · HTTPS · OpenAPI 3.0</text>
  <rect x="64" y="216" width="270" height="38" rx="19" fill="#ffffff" opacity=".14"/>
  <text x="84" y="242" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16">Versión 1.0.0  |  API Key</text>
</svg>
