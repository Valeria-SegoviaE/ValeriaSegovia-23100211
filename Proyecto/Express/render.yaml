services:
  - type: web
    name: api-final-valeria
    runtime: node
    rootDir: Proyecto/Ruta_Documentada/Express
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
