<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>OpenAPI JSON | API REST de Valeria Segovia</title>
    <link rel="stylesheet" href="/docs-navigation.css">
    <style>
        body {
            margin: 0;
            color: #263b50;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: 24px auto;
        }

        h1 {
            margin-top: 24px;
            color: #102a43;
            font-size: 24px;
        }

        .docs-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 30 / 7;
            margin-bottom: 16px;
            overflow: hidden;
            border-radius: 14px;
        }

        .docs-cover > img:first-child {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        .docs-cover-photo {
            position: absolute;
            top: 8.57%;
            left: 65.83%;
            width: 30.83%;
            height: 82.86%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            object-fit: cover;
        }

        .docs-nav--content {
            margin-bottom: 20px;
        }

        .raw-link {
            color: #176b87;
        }

        pre {
            overflow: auto;
            padding: 20px;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <div class="docs-cover" role="img" aria-label="Portada de la API REST de Valeria Segovia">
            <img src="/api-portada.svg" alt="" aria-hidden="true">
            <img class="docs-cover-photo" src="/campus-api.png" alt="" aria-hidden="true">
        </div>
        <nav class="docs-nav docs-nav--content" aria-label="Vistas de documentación">
            <a href="/api-docs">Swagger</a>
            <a href="/json" aria-current="page">JSON</a>
            <a href="/docs">Stoplight</a>
        </nav>
        <h1>Especificación OpenAPI en JSON</h1>
        <p><a class="raw-link" href="/api-docs.json">Abrir el JSON sin formato</a></p>
        <pre id="api-json" role="status">Cargando especificación...</pre>
    </main>
    <script>
        fetch("/api-docs.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`El servidor respondió con HTTP ${response.status}.`);
                }
                return response.json();
            })
            .then((specification) => {
                const output = document.getElementById("api-json");
                output.textContent = JSON.stringify(specification, null, 2);
                output.setAttribute("role", "region");
                output.setAttribute("aria-label", "Especificación OpenAPI");
            })
            .catch((error) => {
                document.getElementById("api-json").textContent =
                    `No se pudo cargar la especificación: ${error.message}`;
            });
    </script>
</body>
</html>
